<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>查询性能监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .chart {
            height: 400px;
            margin-bottom: 20px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .metric-card {
            padding: 20px;
            border-radius: 8px;
            background-color: #f5f5f5;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .metric-label {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>查询性能实时监控</h2>
        <div class="metrics">
            <div class="metric-card">
                <div class="metric-value" id="tps">-</div>
                <div class="metric-label">TPS</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="p50">-</div>
                <div class="metric-label">P50延迟 (秒)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="p95">-</div>
                <div class="metric-label">P95延迟 (秒)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="p99">-</div>
                <div class="metric-label">P99延迟 (秒)</div>
            </div>
        </div>
        <div id="tpsChart" class="chart"></div>
        <div id="latencyChart" class="chart"></div>
    </div>

    <script>
        let tpsChart = echarts.init(document.getElementById('tpsChart'));
        let latencyChart = echarts.init(document.getElementById('latencyChart'));
        
        let tpsData = [];
        let latencyData = [];
        let timeData = [];

        function updateCharts(metrics) {
            const now = new Date().toLocaleTimeString('zh-CN');
            
            // 更新数据
            timeData.push(now);
            tpsData.push(metrics.tps);
            latencyData.push([
                metrics.latencyP50,
                metrics.latencyP95,
                metrics.latencyP99
            ]);

            // 保持最近120个数据点（2分钟）
            if (timeData.length > 120) {
                timeData.shift();
                tpsData.shift();
                latencyData.shift();
            }

            // TPS图表配置
            tpsChart.setOption({
                title: { 
                    text: 'TPS趋势',
                    textStyle: {
                        fontSize: 16,
                        fontFamily: '"Microsoft YaHei", "微软雅黑", sans-serif'
                    }
                },
                tooltip: { 
                    trigger: 'axis',
                    formatter: '{b}<br/>TPS: {c}'
                },
                xAxis: { 
                    type: 'category', 
                    data: timeData,
                    axisLabel: {
                        fontFamily: '"Microsoft YaHei", "微软雅黑", sans-serif',
                        rotate: 45,  // 斜着显示时间，避免重叠
                        interval: 'auto'  // 自动计算显示间隔
                    }
                },
                yAxis: { 
                    type: 'value',
                    axisLabel: {
                        formatter: '{value} 次/秒'
                    }
                },
                series: [{
                    data: tpsData,
                    type: 'line',
                    smooth: true,
                    areaStyle: {
                        opacity: 0.1
                    }
                }]
            });

            // 延迟图表配置
            latencyChart.setOption({
                title: { 
                    text: '延迟趋势',
                    textStyle: {
                        fontSize: 16,
                        fontFamily: '"Microsoft YaHei", "微软雅黑", sans-serif'
                    }
                },
                tooltip: { 
                    trigger: 'axis',
                    formatter: function(params) {
                        let result = params[0].axisValue + '<br/>';
                        params.forEach(param => {
                            result += param.seriesName + ': ' + param.value.toFixed(3) + ' 秒<br/>';
                        });
                        return result;
                    }
                },
                legend: {
                    data: ['P50', 'P95', 'P99'],
                    textStyle: {
                        fontFamily: '"Microsoft YaHei", "微软雅黑", sans-serif'
                    }
                },
                xAxis: { 
                    type: 'category', 
                    data: timeData,
                    axisLabel: {
                        fontFamily: '"Microsoft YaHei", "微软雅黑", sans-serif'
                    }
                },
                yAxis: { 
                    type: 'value',
                    axisLabel: {
                        formatter: '{value} 秒'
                    }
                },
                series: [
                    {
                        name: 'P50',
                        type: 'line',
                        data: latencyData.map(d => d[0]),
                        smooth: true
                    },
                    {
                        name: 'P95',
                        type: 'line',
                        data: latencyData.map(d => d[1]),
                        smooth: true
                    },
                    {
                        name: 'P99',
                        type: 'line',
                        data: latencyData.map(d => d[2]),
                        smooth: true
                    }
                ]
            });

            // 更新指标卡���
            document.getElementById('tps').textContent = metrics.tps.toFixed(2);
            document.getElementById('p50').textContent = metrics.latencyP50.toFixed(3);
            document.getElementById('p95').textContent = metrics.latencyP95.toFixed(3);
            document.getElementById('p99').textContent = metrics.latencyP99.toFixed(3);
        }

        function fetchMetrics() {
            fetch('/api/query-metrics')
                .then(response => response.json())
                .then(data => updateCharts(data));
        }

        // 每秒更新一次数据
        setInterval(fetchMetrics, 1000);

        // 窗口大小改变时重绘图表
        window.addEventListener('resize', function() {
            tpsChart.resize();
            latencyChart.resize();
        });
    </script>
</body>
</html>
